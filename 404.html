<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHREIS 7 — A Personal Digital Playground</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030406">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Michroma';src:url(/fonts/michroma-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Rajdhani';src:url(/fonts/rajdhani-600.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--glow:#1a7dff;--glow2:#3fa9ff;--bg:#030406;--txt:#e9eef5;--mut:rgba(170,200,240,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,rgba(26,125,255,.12),transparent 60%);pointer-events:none}
.hud{position:fixed;inset:22px;pointer-events:none}
.hud i{position:absolute;width:42px;height:42px;border:1.5px solid var(--glow2);filter:drop-shadow(0 0 6px var(--glow));opacity:.8}
.hud i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.hud i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.hud i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.hud i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.hud span{position:absolute;top:14px;left:58px;font-size:.68rem;letter-spacing:.35em;color:rgba(160,200,255,.55);font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;margin-right:8px;vertical-align:middle;animation:blink 1.6s infinite}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
img{width:96px;height:96px;margin-bottom:30px;opacity:.9;filter:drop-shadow(0 0 12px rgba(63,169,255,.45))}
.code{font-family:'Michroma',sans-serif;font-size:2.4rem;letter-spacing:.3em;margin-right:-.3em;color:var(--glow2);text-shadow:0 0 14px var(--glow)}
h1{font-family:'Michroma',sans-serif;font-weight:400;font-size:.95rem;letter-spacing:.3em;margin:14px -.3em 12px 0}
p{font-size:.78rem;letter-spacing:.3em;color:var(--mut);margin-bottom:34px}
a{display:inline-block;padding:15px 30px;border:1px solid rgba(63,169,255,.45);background:rgba(26,125,255,.14);color:#cfe3ff;text-decoration:none;font-size:.8rem;letter-spacing:.4em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .2s,box-shadow .2s}
a:hover,a:focus-visible{background:rgba(26,125,255,.32);color:#fff;box-shadow:0 0 18px rgba(26,125,255,.4);outline:none}
@keyframes blink{50%{opacity:.25}}
@media (max-width:600px){.hud{inset:12px}.hud i{width:28px;height:28px}.hud span{top:9px;left:38px;font-size:.54rem;letter-spacing:.22em}.code{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="hud" aria-hidden="true"><i></i><i></i><i></i><i></i><span><b class="dot"></b>SIGNAL LOST</span></div>
<main>
  <img src="/favicon.svg" alt="">
  <div class="code">404</div>
  <h1>OUT OF FRAME</h1>
  <p>THIS ANGLE DOESN’T EXIST.</p>
  <a href="/">BACK TO START</a>
</main>
</body>
</html>
