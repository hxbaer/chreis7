---
layout: null
---
{% assign l = site.data.legal %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ l.seo_title | escape }}</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#030406">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>(function(){try{if(sessionStorage.getItem('ch7mode')==='neon'){var l=document.querySelector('link[rel=icon]');if(l)l.href='favicon-mia.svg'}}catch(e){}})();</script>
<style>
@font-face{font-family:'Michroma';src:url(fonts/michroma-400.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Rajdhani';src:url(fonts/rajdhani-500.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Rajdhani';src:url(fonts/rajdhani-600.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Rajdhani';src:url(fonts/rajdhani-700.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
</style>
<script>try{if(sessionStorage.getItem('ch7mode')==='neon')document.documentElement.classList.add('neon')}catch(e){}</script>
<style>
:root{--glow:#1a7dff;--glow2:#3fa9ff;--bg:#030406;--line:rgba(63,169,255,.35);--txt:#e9eef5;--mut:rgba(170,200,240,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100svh;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 0,rgba(26,125,255,.12),transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:min(1100px,100%);margin:0 auto;padding:18px 18px 60px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:6px 0 18px;border-bottom:1px solid var(--line)}
header .brand{justify-self:center}
header .tag{justify-self:end;font-size:.72rem;letter-spacing:.3em;color:var(--mut);text-align:right}
.brand{display:flex;align-items:center;gap:12px}
.brand .lg{width:30px;height:30px;--wf:#fff;--bf:#1a7dff;filter:drop-shadow(0 0 6px rgba(63,169,255,.6))}
.brand b{font-family:'Michroma',sans-serif;font-weight:400;font-size:.95rem;letter-spacing:.3em}
.accent{color:var(--glow2);text-shadow:0 0 10px var(--glow)}
.back{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 12px;border:1px solid var(--line);color:var(--mut);text-decoration:none;font:600 .74rem 'Rajdhani',sans-serif;letter-spacing:.28em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:all .2s;justify-self:start}
.back svg{width:14px;height:14px}
.back:hover{color:#fff;border-color:var(--glow2);background:rgba(26,125,255,.16);box-shadow:0 0 14px rgba(26,125,255,.35)}
@media (max-width:700px){header{grid-template-columns:1fr auto 1fr}header .brand b{display:none}header .brand{gap:0}header .back{justify-self:start}.back{padding:0 12px 0 8px;letter-spacing:.2em}header .tag{font-size:.62rem;letter-spacing:.2em}}
.doc{max-width:760px;margin:0 auto;padding-top:clamp(26px,6vh,56px)}
.panel{position:relative;border:1px solid var(--line);background:rgba(8,24,48,.35);padding:clamp(20px,4vw,36px);margin-bottom:26px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}

h1{font-family:'Michroma',sans-serif;font-weight:400;font-size:clamp(1.05rem,3vw,1.4rem);letter-spacing:.18em;margin-bottom:6px;text-transform:uppercase}
.sub{font-size:.72rem;letter-spacing:.28em;color:var(--mut);text-transform:uppercase;margin-bottom:22px}
h2{font-family:'Michroma',sans-serif;font-weight:400;font-size:.78rem;letter-spacing:.16em;color:#cfe3ff;margin:24px 0 8px;text-transform:uppercase}
h2:first-of-type{margin-top:0}
p,li{font-size:1.02rem;line-height:1.55;color:rgba(233,238,245,.86);font-weight:500}
p+p{margin-top:10px}
ul{padding-left:20px;margin-top:6px}
li{margin:3px 0}
.addr{font-size:1.12rem;line-height:1.6;color:var(--txt)}
a{color:var(--glow2);text-decoration:none;border-bottom:1px solid rgba(63,169,255,.35)}
a:hover{color:#fff;border-color:var(--glow2)}
a.back{border-bottom:1px solid var(--line)}
.stand{font-size:.72rem;letter-spacing:.28em;color:var(--mut);text-align:center;text-transform:uppercase;margin-top:8px}
html.neon{--glow:#ff3e9a;--glow2:#00e0d1;--bg:#140a30;--line:rgba(0,224,209,.38);--txt:#fff3f8;--mut:rgba(255,190,225,.65)}
html.neon,html.neon body{background:linear-gradient(180deg,#14206e 0%,#2b1a80 35%,#4a1a80 65%,#6a1a6e 100%) fixed}
html.neon body::before{background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),radial-gradient(ellipse 90% 40% at 50% 105%,rgba(255,122,74,.35),rgba(255,62,154,.15) 50%,transparent 75%)}
html.neon .brand .lg{--bf:#00e0d1;filter:drop-shadow(0 0 7px rgba(255,62,154,.55))}
html.neon .brand b{text-shadow:0 0 12px rgba(255,62,154,.6)}
html.neon .accent{color:#00e0d1;text-shadow:0 0 10px rgba(0,224,209,.7)}
html.neon .back:hover{background:rgba(0,224,209,.16);box-shadow:0 0 14px rgba(0,224,209,.4)}
html.neon .panel{background:rgba(18,10,60,.72);box-shadow:inset 0 0 0 1px rgba(255,62,154,.15)}
html.neon h1{text-shadow:0 0 12px rgba(255,62,154,.55)}
html.neon h2{color:#00e0d1}
html.neon p,html.neon li{color:rgba(245,236,255,.9)}
html.neon a{border-bottom-color:rgba(0,224,209,.4)}
html.neon a.back{border-bottom:1px solid var(--line)}
.lgw{position:relative;display:inline-flex;width:30px;height:30px;margin:0 6px}
.lgw::before,.lgw::after{content:"";position:absolute;inset:-8px;border-radius:50%;pointer-events:none}
.lgw::before{border:1px solid rgba(63,169,255,.22)}
.lgw::after{border:2px solid transparent;border-top-color:#3fa9ff;border-right-color:rgba(63,169,255,.35);filter:drop-shadow(0 0 4px #1a7dff);animation:lgspin 4s linear infinite}
@keyframes lgspin{to{transform:rotate(360deg)}}
html.neon .lgw::before{border-color:rgba(255,110,199,.3)}
html.neon .lgw::after{border-top-color:#00e0d1;border-right-color:rgba(255,110,199,.5);filter:drop-shadow(0 0 4px #00e0d1)}
@media (prefers-reduced-motion:reduce){.lgw::after{animation:none}}
header .tag{display:inline-flex;align-items:center;height:38px;padding:0 12px 0 16px;border:1px solid var(--line);color:var(--mut);font:600 .74rem 'Rajdhani',sans-serif;letter-spacing:.28em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
@media (max-width:700px){header .tag{padding:0 8px 0 12px;font-size:.74rem;letter-spacing:.2em}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="ch7m" viewBox="0 0 520 525">{{ site.data.brand.logo_svg }}</symbol></defs></svg>
<div class="wrap">
  <header>
    <a class="back" href="index.html" aria-label="Back to CHREIS7"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>{{ l.back_label | escape }}</a>
    <div class="brand"><span class="lgw"><svg class="lg" viewBox="0 0 520 525" aria-hidden="true"><use href="#ch7m"/></svg></span><b>CHREIS<span class="accent">7</span></b></div>
    <div class="tag">{{ l.tag | escape }}</div>
  </header>

  <main class="doc">
{%- for p in l.panels %}
    <section class="panel" data-id="{{ p.code | escape }}" id="{{ p.anchor }}">
      <h1>{{ p.title | escape }}</h1>
      <p class="sub">{{ p.subtitle | escape }}</p>{{ p.body }}
    </section>
{% endfor %}
    <p class="stand">Last updated · {{ l.updated | escape }}</p>
  </main>
</div>
</body>
</html>
