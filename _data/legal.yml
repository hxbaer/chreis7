          <h2>1 · Controller</h2>
          <p>CHREIS7 Studio, Zürich, Switzerland · <a href="mailto:hoi@chreis7.ch">hoi@chreis7.ch</a></p>

          <h2>2 · Hosting and server logs</h2>
          <p id="hosting">This website is hosted by GitHub Pages, a service of GitHub, Inc., USA. When pages are accessed, the host processes technically necessary data in server log files: IP address, date and time, page requested, referrer, browser and operating system. This serves the secure and stable operation of the website (legitimate interest, Art. 6(1)(f) GDPR). GitHub, Inc. is certified under the EU-U.S. Data Privacy Framework.</p>

          <h2>3 · No cookies, no tracking</h2>
          <p>This website sets no cookies and uses no analytics, tracking or advertising services.</p>
          <p>All fonts, images and scripts are served directly from this website. No connection is made to Google Fonts, content delivery networks or other third-party providers.</p>

          <h2>4 · Contact form and email</h2>
          <p>If you use the contact form, your name, email address and message are transmitted via the form service FormSubmit (formsubmit.co) and delivered to the operator by email. The data is used only to answer your request and is not passed on for any other purpose. The same applies if you contact us by email.</p>

          <h2>5 · Your rights</h2>
          <p>You have the right to access, rectification, erasure, restriction of processing, data portability and to object. An informal email is sufficient. You may also lodge a complaint with a supervisory authority: in Switzerland the Federal Data Protection and Information Commissioner (FDPIC), in the EU the authority in your place of residence.</p>
